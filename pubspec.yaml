name: manolocal_front
description: "ManoLocal - Plataforma móvil de conexión entre empleadores y especialistas locales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  provider: ^6.1.5
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  go_router: ^17.0.0
  socket_io_client: ^3.1.6
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
